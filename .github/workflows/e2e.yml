# The browser suite (D52): every pull request, every push to main, nightly and
# on request. make e2e starts its own stack in the job (D53) and removes it.
name: Browser checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * *" # nightly, 02:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer commit cancels the older run of the same pull request or branch.
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make e2e
        env:
          SHOTS: /e2e/shots
      - name: Screenshots of the files that failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-screenshots
          path: e2e/shots/
          if-no-files-found: ignore
          retention-days: 14
