# The browser suite (D52): nightly, on request, and when a push changes the
# suite or its stack; not on every push (it takes minutes). make e2e starts its
# own stack in the job (D53) and removes it.
name: Browser checks

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *" # nightly, 02:30 UTC
  push:
    paths:
      - "e2e/**"
      - "docker-compose.e2e.yml"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make e2e
        env:
          SHOTS: /e2e/shots
      - name: Screenshots of the files that failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-screenshots
          path: e2e/shots/
          if-no-files-found: ignore
          retention-days: 14
