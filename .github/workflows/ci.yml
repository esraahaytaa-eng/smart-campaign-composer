# Tests, lint and the secret and personal-data scan (D52), each in Docker
# exactly as on a developer's machine (make test, make lint, make scan).
# Runs on every push and every pull request. A push to a branch with an open
# pull request is left to the pull request's run, which tests the same commit
# merged with main, so nothing runs twice. Actions are pinned to commits.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer commit cancels the older run of the same pull request or branch.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep the Go and npm caches in the workspace so actions/cache can save them.
  COMPOSE_FILE: docker-compose.yml:.github/ci/compose.cache.yml

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          run=true
          if [ "$EVENT" = push ] && [ "$REF" != refs/heads/main ] &&
            [ -n "$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            run=false # the pull request's run covers this commit
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT ref=$REF run=$run"

  test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ci-cache
          key: deps-${{ runner.os }}-${{ hashFiles('go.sum', 'web/package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-
      - run: mkdir -p .ci-cache/gomod .ci-cache/gobuild .ci-cache/web-node-modules
      - run: make test

  lint:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ci-cache
          key: deps-${{ runner.os }}-${{ hashFiles('go.sum', 'web/package-lock.json') }}
          restore-keys: deps-${{ runner.os }}-
      - run: mkdir -p .ci-cache/gomod .ci-cache/gobuild .ci-cache/web-node-modules
      - run: make lint

  scan:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the new commits are scanned too
      - name: The rules still catch planted secrets and personal data
        run: make scan-selftest
      - name: Files in the repository
        run: scripts/scan.sh tree
      - name: New commits (not on main yet, or just pushed to main)
        env:
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$REF" = refs/heads/main ]; then
            case "$BEFORE" in
              ""|0000000000000000000000000000000000000000) echo "no earlier commit to compare with" ;;
              *) scripts/scan.sh range "$BEFORE..HEAD" ;;
            esac
          else
            scripts/scan.sh range origin/main..HEAD
          fi
