x-db-url: &db-url postgres://scc:${POSTGRES_PASSWORD:-scc}@postgres:5432/scc?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scc}
      POSTGRES_DB: scc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scc -d scc"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: *db-url
      # Demo login marketer@marketer.com, local use only (D10); override in .env.
      DEMO_MARKETER_PASSWORD: "${DEMO_MARKETER_PASSWORD:-Demo1234!}"
      PROVIDER_DB_PASSWORD: ${PROVIDER_DB_PASSWORD:-provider-demo}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["api"]
    environment:
      DATABASE_URL: *db-url
      LLM_MODE: ${LLM_MODE:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60s}
      WEB_DIR: /srv/web # the built frontend in the image (T15)
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Sends approved campaigns through the provider (D18, D19). Exactly one
  # replica: the 100/s per-channel limit lives in this process.
  worker:
    build: .
    command: ["worker"]
    environment:
      DATABASE_URL: *db-url
      PROVIDER_URL: http://mock-provider:8080
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mock SMS and email provider (D20). Logs in as its own role, which can only
  # use the provider schema (D6). Behaviour per channel: SMS_* / EMAIL_* in .env.example.
  mock-provider:
    build: .
    command: ["mock-provider"]
    environment:
      DATABASE_URL: postgres://scc_provider:${PROVIDER_DB_PASSWORD:-provider-demo}@postgres:5432/scc?sslmode=disable
      PROVIDER_SEED: ${PROVIDER_SEED:-1}
      SMS_DELAY_MS_MIN: ${SMS_DELAY_MS_MIN:-20}
      SMS_DELAY_MS_MAX: ${SMS_DELAY_MS_MAX:-200}
      SMS_ERROR_RATE: ${SMS_ERROR_RATE:-0.05}
      SMS_RATE_LIMIT_RATE: ${SMS_RATE_LIMIT_RATE:-0.03}
      SMS_TIMEOUT_RATE: ${SMS_TIMEOUT_RATE:-0.01}
      EMAIL_DELAY_MS_MIN: ${EMAIL_DELAY_MS_MIN:-20}
      EMAIL_DELAY_MS_MAX: ${EMAIL_DELAY_MS_MAX:-200}
      EMAIL_ERROR_RATE: ${EMAIL_ERROR_RATE:-0.05}
      EMAIL_RATE_LIMIT_RATE: ${EMAIL_RATE_LIMIT_RATE:-0.03}
      EMAIL_TIMEOUT_RATE: ${EMAIL_TIMEOUT_RATE:-0.01}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Test profile (make test): throwaway database on tmpfs + Go tests on the mounted source.
  test-db:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scc
      POSTGRES_PASSWORD: scc
      POSTGRES_DB: scc_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scc -d scc_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  go-test:
    profiles: ["test"]
    image: golang:1.26-alpine
    working_dir: /src
    command: ["go", "test", "-count=1", "./..."]
    environment:
      CGO_ENABLED: "0"
      DATABASE_URL: postgres://scc:scc@test-db:5432/scc_test?sslmode=disable
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
      # Compiled packages survive between runs; without it every run recompiled
      # all dependencies (the Anthropic SDK alone took ~1.5 min).
      - gobuildcache:/root/.cache/go-build
    depends_on:
      test-db:
        condition: service_healthy

  # Frontend checks (make test): the type check and Vitest.
  web-test:
    profiles: ["test"]
    image: node:22-alpine
    working_dir: /web
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run typecheck && npm test"]
    volumes:
      - ./web:/web
      # Its own node_modules, so npm ci never replaces the host's copy.
      - webnodemodules:/web/node_modules
      - npmcache:/root/.npm

volumes:
  pgdata:
  gomodcache:
  gobuildcache:
  webnodemodules:
  npmcache:
